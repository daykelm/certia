name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certia
          POSTGRES_PASSWORD: certia
          POSTGRES_DB: certia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://certia:certia@localhost:5432/certia
      DEV_USER_EMAIL: admin@certia-es.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Every check runs even if a previous one fails,
      # so a single run reports all problems.
      - name: Lint
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Lint pnpm exec eslint .
      - name: Types
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Types pnpm -r --no-bail typecheck
      - name: Measures
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Measures pnpm measures:check
      - name: Tests
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Tests pnpm test
      - name: Migrations in sync with the schema
        if: ${{ !cancelled() }}
        # Fails if the Drizzle schema has changes without a committed migration.
        run: .github/scripts/step.sh Migrations-drift bash -c "pnpm db:generate && git status --porcelain packages/db/migrations && test -z \"\$(git status --porcelain packages/db/migrations)\""
      - name: Migrations and seed data
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Migrations bash -c "pnpm db:migrate && pnpm db:seed"
      - name: Build
        if: ${{ !cancelled() }}
        run: .github/scripts/step.sh Build pnpm build

  # TODO: deploy to staging on Cloud Run (Artifact Registry + migrations + deploy)
  # once the Google Cloud project exists. See README.md, "Deployment".
