name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certia
          POSTGRES_PASSWORD: certia
          POSTGRES_DB: certia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://certia:certia@localhost:5432/certia
      DEV_USER_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Caching needs pnpm-lock.yaml; enable it once the lockfile is committed.
          package-manager-cache: false
      - name: Dependencies
        # Until pnpm-lock.yaml is committed, install without a lockfile.
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      # Every check runs even if a previous one fails,
      # so a single run reports all problems.
      - name: Lint
        if: ${{ !cancelled() }}
        run: .github/scripts/paso.sh Lint pnpm exec eslint .
      - name: Types
        if: ${{ !cancelled() }}
        run: .github/scripts/paso.sh Types pnpm -r --no-bail typecheck
      - name: Fichas
        if: ${{ !cancelled() }}
        run: .github/scripts/paso.sh Fichas pnpm fichas:check
      - name: Tests
        if: ${{ !cancelled() }}
        run: .github/scripts/paso.sh Tests pnpm test
      - name: Migrations and seed data
        if: ${{ !cancelled() }}
        # db:generate creates the initial migration if it is not in the repo yet.
        run: .github/scripts/paso.sh Migrations bash -c "pnpm db:generate && pnpm db:migrate && pnpm db:seed"
      - name: Build
        if: ${{ !cancelled() }}
        run: .github/scripts/paso.sh Build pnpm build

  # TODO: deploy to staging on Cloud Run (Artifact Registry + migrations + deploy)
  # once the Google Cloud project exists. See README.md, "Deployment".
