name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certia
          POSTGRES_PASSWORD: certia
          POSTGRES_DB: certia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U certia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://certia:certia@localhost:5432/certia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        # Hasta que se suba pnpm-lock.yaml, se instala sin lockfile.
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Lint y tipos
        run: pnpm lint
      - name: Fichas
        run: pnpm fichas:check
      - name: Tests
        run: pnpm test
      - name: Migraciones y datos de ejemplo
        # db:generate crea la migración inicial si aún no está en el repositorio.
        run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
        env:
          DEV_USER_EMAIL: admin@example.com
      - name: Build
        run: pnpm build

  # TODO: despliegue a staging en Cloud Run (Artifact Registry + migraciones + deploy)
  # cuando exista el proyecto de Google Cloud. Ver README.md, sección "Despliegue".
