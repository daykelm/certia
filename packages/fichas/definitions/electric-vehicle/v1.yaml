# ⚠️ SAMPLE TEMPLATE — illustrative values.
# Replace code, factors, formula and documents with those of the official ficha.
code: TRA-VE
version: 1
name: Vehículo eléctrico (versión anterior)
description: Sustitución o adquisición de un vehículo eléctrico.
validity:
  from: "2023-01-01"
  to: "2025-12-31"

fields:
  - id: tipo_vehiculo
    label: Categoría del vehículo
    type: enum
    options: [M1, N1]
    source: document:ficha_tecnica
  - id: matricula
    label: Matrícula
    type: text
    source: document:permiso_circulacion
  - id: fecha_matriculacion
    label: Fecha de matriculación
    type: date
    source: document:permiso_circulacion

constants:
  ahorro_anual_kwh:
    M1: 600
    N1: 900
  vida_util_anios: 10

calculation:
  formula: "ahorro_anual_kwh[tipo_vehiculo] * vida_util_anios"

tests:
  - description: Turismo M1
    input: { tipo_vehiculo: M1, matricula: "1234ABC", fecha_matriculacion: "2024-05-10" }
    expected_kwh: 6000
  - description: Furgoneta N1
    input: { tipo_vehiculo: N1, matricula: "5678DEF", fecha_matriculacion: "2024-06-01" }
    expected_kwh: 9000

documents:
  - type: dni
    label: DNI o NIE del titular
  - type: permiso_circulacion
    label: Permiso de circulación
    extract: [matricula, fecha_matriculacion]
  - type: ficha_tecnica
    label: Ficha técnica del vehículo
    extract: [tipo_vehiculo]
  - type: factura_compra
    label: Factura de compra
  - type: acuerdo_cesion
    label: Acuerdo de cesión de ahorros
    generated: true
  - type: declaracion_responsable
    label: Declaración responsable
    generated: true

grouping:
  required: true
  keys: [region, year]
  min_kwh: 30000

templates:
  - id: acuerdo_cesion
    document: acuerdo_cesion
    file: templates/electric-vehicle/acuerdo_cesion_v1.docx
    optional_clauses:
      - id: clausula_transitoria
        label: Cláusula transitoria
  - id: declaracion_responsable
    document: declaracion_responsable
    file: templates/electric-vehicle/declaracion_responsable_v1.docx

packaging:
  max_size_mb: 10
  name_pattern: "{reference}_{type}"
