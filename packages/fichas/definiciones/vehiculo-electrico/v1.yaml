# ⚠️ SAMPLE TEMPLATE — illustrative values.
# Replace code, factors, formula and documents with those of the official ficha.
codigo: TRA-VE
version: 1
nombre: Vehículo eléctrico (versión anterior)
descripcion: Sustitución o adquisición de un vehículo eléctrico.
vigencia:
  desde: "2023-01-01"
  hasta: "2025-12-31"

campos:
  - id: tipo_vehiculo
    etiqueta: Categoría del vehículo
    tipo: enum
    opciones: [M1, N1]
    fuente: documento:ficha_tecnica
  - id: matricula
    etiqueta: Matrícula
    tipo: texto
    fuente: documento:permiso_circulacion
  - id: fecha_matriculacion
    etiqueta: Fecha de matriculación
    tipo: fecha
    fuente: documento:permiso_circulacion

constantes:
  ahorro_anual_kwh:
    M1: 600
    N1: 900
  vida_util_anios: 10

calculo:
  formula: ahorro_anual_kwh[tipo_vehiculo] * vida_util_anios

pruebas:
  - descripcion: Turismo M1
    entrada: { tipo_vehiculo: M1, matricula: 1234ABC, fecha_matriculacion: "2024-05-10" }
    esperado_kwh: 6000
  - descripcion: Furgoneta N1
    entrada: { tipo_vehiculo: N1, matricula: 5678DEF, fecha_matriculacion: "2024-06-01" }
    esperado_kwh: 9000

documentos:
  - tipo: dni
    etiqueta: DNI o NIE del titular
  - tipo: permiso_circulacion
    etiqueta: Permiso de circulación
    extraer: [matricula, fecha_matriculacion]
  - tipo: ficha_tecnica
    etiqueta: Ficha técnica del vehículo
    extraer: [tipo_vehiculo]
  - tipo: factura_compra
    etiqueta: Factura de compra
  - tipo: acuerdo_cesion
    etiqueta: Acuerdo de cesión de ahorros
    generado: true
  - tipo: declaracion_responsable
    etiqueta: Declaración responsable
    generado: true

agrupacion:
  requerida: true
  claves: [comunidad_autonoma, anio]
  minimo_kwh: 30000

plantillas:
  - id: acuerdo_cesion
    documento: acuerdo_cesion
    archivo: plantillas/vehiculo-electrico/acuerdo_cesion_v1.docx
    clausulas_opcionales:
      - id: clausula_transitoria
        etiqueta: Cláusula transitoria
  - id: declaracion_responsable
    documento: declaracion_responsable
    archivo: plantillas/vehiculo-electrico/declaracion_responsable_v1.docx

empaquetado:
  tamano_max_mb: 10
  patron_nombre: "{referencia}_{tipo}"
