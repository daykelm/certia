# ⚠️ PLANTILLA DE EJEMPLO — valores ilustrativos.
# Sustituir código, factores, fórmula y documentos por los de la ficha oficial.
# Ilustra una nueva versión que añade parámetros (achatarramiento) y un documento condicional.
codigo: TRA-VE
version: 2
nombre: Vehículo eléctrico (versión vigente)
descripcion: Sustitución o adquisición de un vehículo eléctrico.
vigencia:
  desde: "2026-01-01"

campos:
  - id: tipo_vehiculo
    etiqueta: Categoría del vehículo
    tipo: enum
    opciones: [M1, N1]
    fuente: documento:ficha_tecnica
  - id: matricula
    etiqueta: Matrícula
    tipo: texto
    fuente: documento:permiso_circulacion
  - id: fecha_matriculacion
    etiqueta: Fecha de matriculación
    tipo: fecha
    fuente: documento:permiso_circulacion
  - id: achatarramiento
    etiqueta: ¿Se achatarró un vehículo de combustión?
    tipo: booleano
  - id: km_anuales
    etiqueta: Kilómetros anuales estimados
    tipo: entero
    unidad: km
    min: 0
    max: 100000
    obligatorio: false

constantes:
  ahorro_anual_kwh:
    M1: 600
    N1: 900
  vida_util_anios: 10
  factor_achatarramiento: 1.15

calculo:
  formula: ahorro_anual_kwh[tipo_vehiculo] * vida_util_anios * (achatarramiento ? factor_achatarramiento : 1)

pruebas:
  - descripcion: Turismo M1 sin achatarramiento
    entrada: { tipo_vehiculo: M1, matricula: 1234ABC, fecha_matriculacion: "2026-02-10", achatarramiento: false }
    esperado_kwh: 6000
  - descripcion: Turismo M1 con achatarramiento
    entrada: { tipo_vehiculo: M1, matricula: 1234ABC, fecha_matriculacion: "2026-02-10", achatarramiento: true }
    esperado_kwh: 6900

documentos:
  - tipo: dni
    etiqueta: DNI o NIE del titular
  - tipo: permiso_circulacion
    etiqueta: Permiso de circulación
    extraer: [matricula, fecha_matriculacion]
  - tipo: ficha_tecnica
    etiqueta: Ficha técnica del vehículo
    extraer: [tipo_vehiculo]
  - tipo: factura_compra
    etiqueta: Factura de compra
  - tipo: certificado_baja
    etiqueta: Certificado de baja del vehículo achatarrado
    condicion: achatarramiento
  - tipo: acuerdo_cesion
    etiqueta: Acuerdo de cesión de ahorros
    generado: true
  - tipo: declaracion_responsable
    etiqueta: Declaración responsable
    generado: true

agrupacion:
  requerida: true
  claves: [comunidad_autonoma, anio]
  minimo_kwh: 30000

plantillas:
  - id: acuerdo_cesion
    documento: acuerdo_cesion
    archivo: plantillas/vehiculo-electrico/acuerdo_cesion_v2.docx
    clausulas_opcionales:
      - id: clausula_transitoria
        etiqueta: Cláusula transitoria
  - id: declaracion_responsable
    documento: declaracion_responsable
    archivo: plantillas/vehiculo-electrico/declaracion_responsable_v2.docx

empaquetado:
  tamano_max_mb: 10
  patron_nombre: "{referencia}_{tipo}"
